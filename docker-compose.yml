services:
  postgres:
    image: postgres:16-alpine
    container_name: apirout-registry-db
    environment:
      POSTGRES_DB: ${DB_NAME:-main_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Password123!}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - apirout_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apirout-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  apirout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apirout
    environment:
      ROLE: ${ROLE:-traditional}
      APP_ENV: ${APP_ENV:-development}
      PROXY_PORT: ${PROXY_PORT:-8000}
      ADMIN_PORT: ${ADMIN_PORT:-8001}
      GUI_PORT: ${GUI_PORT:-8002}
      STATUS_PORT: ${STATUS_PORT:-8100}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-*}
      ADMIN_SECRET: ${ADMIN_SECRET:-MasterSecretKey2026!}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-min-32-characters!}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-apirout-local-dev-aes-encryption-key-32!}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-main_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Password123!}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-10m}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${PROXY_PORT:-8000}:8000"
      - "${ADMIN_PORT:-8001}:8001"
      - "${GUI_PORT:-8002}:8002"
      - "${STATUS_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  apirout_pg_data:
