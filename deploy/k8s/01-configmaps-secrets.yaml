apiVersion: v1
kind: ConfigMap
metadata:
  name: apirout-shared-config
  namespace: apirout
data:
  ROLE: "traditional"
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PROXY_PORT: "8000"
  ADMIN_PORT: "8001"
  GUI_PORT: "8002"
  STATUS_PORT: "8100"
  ADMIN_ALLOWED_IPS: "*"
  DB_TYPE: "postgres"
  DB_HOST: "postgres.apirout.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "main_db"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "5m"
  DB_CONN_MAX_IDLE_TIME: "10m"
  REDIS_HOST: "apirout-redis.apirout.svc.cluster.local"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: apirout-shared-secrets
  namespace: apirout
type: Opaque
stringData:
  JWT_SECRET: "secure-jwt-secret-key-at-least-32-chars-long!"
  APP_ENCRYPTION_KEY: "aes-target-db-encryption-key-32ch!"
  DB_PASSWORD: "PostgresProductionSecurePassword123!"
  ADMIN_SECRET: "MasterSecretKey2026!"
