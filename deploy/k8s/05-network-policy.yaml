apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apirout-data-plane-netpol
  namespace: apirout
spec:
  podSelector:
    matchLabels:
      app: apirout-data-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming API traffic on port 8000 from Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow Prometheus monitoring scraping on port 8100
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8100
  egress:
    # 1. Allow CoreDNS for service discovery
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow Redis for distributed pub/sub & cache invalidation
    - to:
        - podSelector:
            matchLabels:
              app: apirout-redis
      ports:
        - protocol: TCP
          port: 6379
    # 3. Allow Target Database Connections (PostgreSQL, MySQL, MSSQL)
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 1433
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apirout-control-plane-netpol
  namespace: apirout
spec:
  podSelector:
    matchLabels:
      app: apirout-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming Web GUI traffic on port 8002 from Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8002
    # Allow incoming Admin API operations on port 8001
    - ports:
        - protocol: TCP
          port: 8001
  egress:
    # 1. Allow CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow Redis Pub/Sub events
    - to:
        - podSelector:
            matchLabels:
              app: apirout-redis
      ports:
        - protocol: TCP
          port: 6379
    # 3. Allow Registry DB & Target Database Introspection
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 1433
