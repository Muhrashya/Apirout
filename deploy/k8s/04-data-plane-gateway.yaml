apiVersion: apps/v1
kind: Deployment
metadata:
  name: apirout-data-plane
  namespace: apirout
  labels:
    app: apirout-data-plane
    tier: data-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apirout-data-plane
  template:
    metadata:
      labels:
        app: apirout-data-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: apirout/apirout:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "data_plane"
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: apirout-shared-config
            - secretRef:
                name: apirout-shared-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apirout-data-plane
  namespace: apirout
  labels:
    app: apirout-data-plane
spec:
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: status
      port: 8100
      targetPort: 8100
  selector:
    app: apirout-data-plane
---
# Horizontal Pod Autoscaler (HPA): Autoscaling from 3 to 20 Pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apirout-data-plane-hpa
  namespace: apirout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apirout-data-plane
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Public Ingress for External API Consumers (Port 8000)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apirout-data-plane-ingress
  namespace: apirout
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
    - hosts:
        - api.apirout.io
      secretName: apirout-public-tls
  rules:
    - host: api.apirout.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apirout-data-plane
                port:
                  number: 8000
