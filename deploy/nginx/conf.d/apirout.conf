# ==============================================================================
# Upstream Definitions for Apirout 4-Port Architecture
# ==============================================================================
upstream apirout_gateway_upstream {
    server apirout:8000;
    keepalive 32;
}

upstream apirout_admin_upstream {
    server apirout:8001;
    keepalive 16;
}

upstream apirout_gui_upstream {
    server apirout:8002;
    keepalive 16;
}

upstream apirout_status_upstream {
    server apirout:8100;
    keepalive 8;
}

# ==============================================================================
# 1. HTTP Server (Port 80): ACME Challenge, Healthcheck & HTTPS Redirection
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Authentic Edge Liveness / Healthcheck (Proxies directly to backend status)
    location = /healthz {
        proxy_pass http://apirout_status_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Global HTTP to HTTPS redirection
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. HTTPS Virtual Host: Consumer API Subdomain (api.domain.com)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^api\..+$;

    # TLS Certificates & Cipher Configuration
    ssl_certificate /etc/nginx/ssl/apirout.crt;
    ssl_certificate_key /etc/nginx/ssl/apirout.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:API_SSL:10m;
    ssl_session_timeout 10m;

    # Authentic Edge Liveness
    location = /healthz {
        proxy_pass http://apirout_status_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # All traffic routed directly to Gateway Proxy
    location / {
        proxy_pass http://apirout_gateway_upstream;
        proxy_http_version 1.1;

        # Client IP and Protocol Preservation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # High-throughput buffers for large JSON payloads
        proxy_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ==============================================================================
# 3. HTTPS Virtual Host: Web Console GUI Subdomain (console.domain.com)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^console\..+$;

    # TLS Certificates & Cipher Configuration
    ssl_certificate /etc/nginx/ssl/apirout.crt;
    ssl_certificate_key /etc/nginx/ssl/apirout.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:GUI_SSL:10m;
    ssl_session_timeout 10m;

    # Authentic Edge Liveness
    location = /healthz {
        proxy_pass http://apirout_status_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Internal Console API forwarding
    location /api/v1/ {
        proxy_pass http://apirout_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web Console GUI (React + Vite SPA)
    location / {
        proxy_pass http://apirout_gui_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR and real-time dashboard events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }
}

# ==============================================================================
# 4. HTTPS Default Server: Unified Path-Based Routing & Network Hardening
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # TLS Certificates & Cipher Configuration
    ssl_certificate /etc/nginx/ssl/apirout.crt;
    ssl_certificate_key /etc/nginx/ssl/apirout.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:DEF_SSL:10m;
    ssl_session_timeout 10m;

    # Authentic Edge Liveness (Proxies to backend status healthcheck)
    location = /healthz {
        proxy_pass http://apirout_status_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Consumer API Gateway Proxy Routes (/api/v1/instant, /api/*)
    location /api/ {
        proxy_pass http://apirout_gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Control Plane Admin Management API (Strict CIDR Isolation per docs/BEST_PRACTICES.md)
    location /admin-api/ {
        # Active default CIDR protection: restrict to internal networks and loopback
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^/admin-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://apirout_admin_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status & Prometheus Metrics (Strict Isolation: Only private monitoring networks)
    location /status/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^/status/(.*)$ /$1 break;
        proxy_pass http://apirout_status_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Web Console GUI Default Root
    location / {
        proxy_pass http://apirout_gui_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }
}
