# ==============================================================================
# Upstream Definitions for Apirout 4-Port Architecture
# ==============================================================================
upstream apirout_gateway_upstream {
    server apirout:8000;
    keepalive 32;
}

upstream apirout_admin_upstream {
    server apirout:8001;
    keepalive 16;
}

upstream apirout_gui_upstream {
    server apirout:8002;
    keepalive 16;
}

upstream apirout_status_upstream {
    server apirout:8100;
    keepalive 8;
}

# ==============================================================================
# Main HTTP Reverse Proxy (Single Entrypoint Ports 80 & 443)
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Edge Liveness / Healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --------------------------------------------------------------------------
    # 1. Consumer API Gateway Proxy Routes (/api/v1/instant, /api/*, custom routes)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://apirout_gateway_upstream;
        proxy_http_version 1.1;

        # Client IP and Protocol Preservation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # High-throughput buffers for large JSON payloads
        proxy_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --------------------------------------------------------------------------
    # 2. Control Plane Admin Management API (/admin-api/ or /api/v1/mgmt)
    # --------------------------------------------------------------------------
    location /admin-api/ {
        # Security: Strip prefix before forwarding to admin port 8001
        rewrite ^/admin-api/(.*)$ /api/v1/$1 break;

        proxy_pass http://apirout_admin_upstream;
        proxy_http_version 1.1;

        # Client IP Preservation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional IP Whitelist restriction (Uncomment and customize for production)
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
    }

    # --------------------------------------------------------------------------
    # 3. Status & Prometheus Metrics (/status/ -> Port 8100)
    # --------------------------------------------------------------------------
    location /status/ {
        # Strict Isolation: Only allow internal monitoring networks
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^/status/(.*)$ /$1 break;
        proxy_pass http://apirout_status_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 4. Web Console GUI (React + Vite SPA)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://apirout_gui_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR and real-time dashboard events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }
}
